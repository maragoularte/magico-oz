:root{--ink:#26324b;--pink:#ff7298;--gold:#ffd166;--green:#5dc69c}*{box-sizing:border-box}body{margin:0;background:#f3efff;color:var(--ink);font-family:Nunito,sans-serif;min-height:100vh;background-image:radial-gradient(#fff 1.2px,transparent 1.2px);background-size:22px 22px}.app{max-width:1120px;margin:auto;padding:18px 24px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}.brand{font:700 22px Fredoka,sans-serif;display:flex;align-items:center;gap:10px}.brand-mark{background:#fff;border-radius:15px;padding:9px 12px;box-shadow:0 4px 0 #ded8ed;font-size:24px}.progress{font-weight:900;color:#717b94;font-size:14px}.track{height:10px;background:#dfd9ee;border-radius:9px;width:180px;display:inline-block;margin-left:8px;overflow:hidden;vertical-align:middle}.track span{height:100%;display:block;background:linear-gradient(90deg,#ff8bb0,#ffc857);border-radius:9px;transition:width .4s}.hero{text-align:center;margin:5px auto 14px}.phase{font:700 clamp(20px,3vw,29px) Fredoka,sans-serif;color:#414c68;margin:0}.hero p{margin:3px 0 0;color:#78829a;font-size:14px;font-weight:800}.scene-wrap{border:8px solid white;border-radius:28px;overflow:hidden;box-shadow:0 9px 0 #dfd9ee,0 15px 30px #6b598d26;background:#c8e5d5}.scene{height:clamp(380px,48vw,500px);position:relative;background:url('cena-oz.jfif') center 55%/cover;overflow:hidden}.scene:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#192b4030,#203c3d12 52%,#23322c38);pointer-events:none}.wind{position:absolute;inset:0;background:repeating-linear-gradient(163deg,transparent 0 72px,#fff3 74px 77px,transparent 80px 150px);opacity:.55;animation:gust 12s linear infinite;pointer-events:none}@keyframes gust{to{background-position:500px 0}}.hint{position:absolute;left:15px;top:15px;z-index:8;border-radius:15px;background:#fffdf0;padding:9px 13px;font-size:12px;font-weight:900;color:#54617c;box-shadow:0 3px 0 #ddd3c4}.character{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:240px;height:340px;z-index:3;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;pointer-events:none}.character img{width:220px;height:290px;object-fit:contain;mix-blend-mode:normal;filter:drop-shadow(0 7px 6px #25304c48)}.char-name{background:white;padding:7px 18px;border:3px solid #f8d16b;border-radius:20px;font:700 18px Fredoka,sans-serif;box-shadow:0 4px 0 #be9950;white-space:nowrap;margin-top:-1px}.object{position:absolute;z-index:5;border:0;background:#fff;border-radius:19px;width:76px;height:76px;display:grid;place-items:center;box-shadow:0 5px 0 #ddd3c4,0 7px 18px #24375438;cursor:pointer;transition:transform .15s,filter .15s;animation:bob 3s ease-in-out infinite}.object:hover{transform:scale(1.1) rotate(-4deg)}.object span{font-size:42px;line-height:1;display:grid;place-items:center}.object img{width:58px;height:58px;object-fit:contain}.object.found{animation:pop .45s ease forwards;pointer-events:none}@keyframes bob{50%{translate:0 -6px;rotate:2deg}}@keyframes pop{45%{scale:1.25}100%{scale:.72;opacity:.35}}.band{margin:17px auto 0;background:#fff;border-radius:22px;padding:14px 20px 16px;box-shadow:0 5px 0 #e0d9ed;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.band-title{min-width:175px}.band-title h2{font:700 16px Fredoka,sans-serif;margin:0}.band-title p{margin:3px 0 0;color:#8992a7;font-size:12px;font-weight:800}.targets{display:flex;gap:12px;align-items:center;flex:1;justify-content:center}.target{width:82px;height:76px;background:#f4f1fa;border:2px dashed #d8d1e7;border-radius:17px;display:grid;place-items:center;position:relative;transition:.2s}.target span{font-size:38px;filter:grayscale(1) brightness(0);opacity:.75;transition:.2s;line-height:1}.target span img{width:48px;height:48px;object-fit:contain;filter:grayscale(1) brightness(0)}.target.done{background:#e6faef;border:2px solid #78d5a6;transform:translateY(-3px)}.target.done span{filter:none;opacity:1}.target.done span img{filter:none}.target small{position:absolute;bottom:3px;color:#61728a;font-size:8px;font-weight:900}.status{height:28px;text-align:center;font-size:14px;font-weight:900;color:#65718c;margin-top:13px}.status.ok{color:#23966d}.status.no{color:#d15b71}.controls{display:flex;justify-content:center;gap:10px;margin-top:5px}.btn{border:0;border-radius:15px;padding:11px 17px;font:900 13px Nunito,sans-serif;cursor:pointer;color:white;background:#7083d7;box-shadow:0 4px 0 #5266b5}.btn.secondary{background:#fff;color:#69758d;box-shadow:0 4px 0 #ded9e9}.btn:hover{transform:translateY(-2px)}.footer{text-align:center;color:#9ba2b2;font-size:11px;font-weight:800;margin-top:18px}.overlay{position:fixed;inset:0;background:#2731499c;display:grid;place-items:center;z-index:20;padding:20px}.card{background:#fffaf0;border:8px solid white;border-radius:30px;max-width:460px;padding:32px;text-align:center;box-shadow:0 10px 0 #d7cfe8}.card .big{font-size:70px}.card h2{font:700 30px Fredoka;margin:8px 0}.card p{font-weight:800;color:#69758d;line-height:1.5}.card button{margin-top:10px}.hidden{display:none}@media(max-width:620px){.app{padding:12px}.top{align-items:flex-start}.brand{font-size:17px}.track{width:90px}.scene{height:400px}.character{bottom:16px;transform:translateX(-50%) scale(.75)}.object{width:58px;height:58px}.object span{font-size:32px}.object img{width:45px;height:45px}.band{justify-content:center;padding:14px 9px}.band-title{width:100%;text-align:center}.targets{gap:7px}.target{width:68px;height:68px}.hint{font-size:10px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><span class="brand-mark">🌪️</span> A VENTANIA DE OZ</div><div class="progress"><span id="progressText"></span><span class="track"><span id="progressBar"></span></span></div></header><section class="hero"><h1 class="phase" id="phaseTitle"></h1><p>ENCONTRE OS 3 OBJETOS DA PERSONAGEM!</p></section><div class="scene-wrap"><section class="scene" id="scene" aria-label="CENA DE OZ"><div class="wind"></div><div class="hint">TOQUE EM UM OBJETO PARA OUVIR O NOME 🔊</div><div class="character"><img id="characterImage" src="" alt=""><div class="char-name" id="charName"></div></div></section></div><section class="band"><div class="band-title"><h2>ENCONTRE AS SOMBRAS</h2><p>TOQUE NOS OBJETOS NA CENA</p></div><div class="targets" id="targets"></div></section><div class="status" id="status" aria-live="polite">BOA SORTE, VIAJANTE!</div><div class="controls"><button class="btn secondary" id="replay">🔊 OUVIR OBJETOS</button><button class="btn hidden" id="next">PRÓXIMA FASE →</button></div><div class="footer">UMA AVENTURA DE OBSERVAÇÃO NA TERRA DE OZ ✨</div></main><div class="overlay hidden" id="finish"><div class="card"><div class="big">🌈</div><h2>VOCÊ ENCONTROU TODOS!</h2><p>AS AMIZADES DE OZ AGRADECEM A SUA AJUDA.</p><button class="btn" id="restart">JOGAR DE NOVO ✨</button></div></div>
<script>
const phases=[
{title:'FASE 1 · A CASA DO KANSAS',name:'DOROTHY',person:'Dorothy-removebg-preview.png',targets:[['SAPATINHO','👠'],['CASA DO KANSAS','🏠'],['TOTÓ','🐕','toto-removebg-preview.png']],items:[['👠','SAPATINHO'],['🏠','CASA DO KANSAS'],['🐕','TOTÓ','toto-removebg-preview.png'],['🎈','BALÃO DE AR QUENTE','balao-oz.jpg'],['🛢️','ALMOTOLIA','oleo.jpg'],['🌾','PALHA','palha.avif']]},
{title:'FASE 2 · O CAMPO DE PAPOULAS',name:'ESPANTALHO',person:'espantalho-removebg-preview.png',targets:[['PALHA','🌾','palha.avif'],['DIPLOMA','📜'],['CHAPÉU PONTUDO','🎩','chapeu-espantalho.png']],items:[['🌾','PALHA','palha.avif'],['📜','DIPLOMA'],['🎩','CHAPÉU PONTUDO','chapeu-espantalho.png'],['🐕','TOTÓ','toto-removebg-preview.png'],['🎈','BALÃO DE AR QUENTE','balao-oz.jpg'],['🛢️','ALMOTOLIA','oleo.jpg']]},
{title:'FASE 3 · A FLORESTA ENCANTADA',name:'HOMEM DE LATA',person:'homem_de_lata-removebg-preview.png',targets:[['MACHADO','🪓'],['ALMOTOLIA','🛢️','oleo.jpg'],['RELÓGIO DE CORAÇÃO','💖']],items:[['🪓','MACHADO'],['🛢️','ALMOTOLIA','oleo.jpg'],['💖','RELÓGIO DE CORAÇÃO'],['🌾','PALHA','palha.avif'],['🎈','BALÃO DE AR QUENTE','balao-oz.jpg'],['🐕','TOTÓ','toto-removebg-preview.png']]},
{title:'FASE 4 · A FLORESTA DOS SONS',name:'LEÃO COVARDE',person:'leaoOZ-removebg-preview.png',targets:[['MEDALHA DE CORAGEM','🏅'],['LAÇO VERMELHO','🎀'],['COROA DE OURO','👑']],items:[['🏅','MEDALHA DE CORAGEM'],['🎀','LAÇO VERMELHO'],['👑','COROA DE OURO'],['🌾','PALHA','palha.avif'],['🛢️','ALMOTOLIA','oleo.jpg'],['🎈','BALÃO DE AR QUENTE','balao-oz.jpg']]},
{title:'FASE 5 · O SALÃO DO MÁGICO',name:'MÁGICO DE OZ',person:'magico-oz-recorte.png',targets:[['BALÃO DE AR QUENTE','🎈','balao-oz.jpg'],['MÁQUINA DE ILUSÕES','🎭'],['CARTOLA DE MÁGICO','🎩']],items:[['🎈','BALÃO DE AR QUENTE','balao-oz.jpg'],['🎭','MÁQUINA DE ILUSÕES'],['🎩','CARTOLA DE MÁGICO'],['🐕','TOTÓ','toto-removebg-preview.png'],['🛢️','ALMOTOLIA','oleo.jpg'],['🌾','PALHA','palha.avif']]},
{title:'FASE 6 · O CASTELO SOMBRIO',name:'BRUXA MÁ DO OESTE',person:'bruxa-removebg-preview.png',targets:[['VASSOURA VOADORA','🧹'],['BOLA DE CRISTAL','🔮'],['MACACOS VOADORES','🐒']],items:[['🧹','VASSOURA VOADORA'],['🔮','BOLA DE CRISTAL'],['🐒','MACACOS VOADORES'],['🎩','CHAPÉU DE BRUXA','chapeu-bruxa.jfif'],['🛢️','ALMOTOLIA','oleo.jpg'],['🎈','BALÃO DE AR QUENTE','balao-oz.jpg']]},

];
const positions=[[3,22],[15,52],[4,73],[81,22],[90,49],[82,72]];let current=0,found=new Set();const scene=document.querySelector('#scene'),targets=document.querySelector('#targets'),status=document.querySelector('#status');function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.88;speechSynthesis.speak(u)}function markup(icon,file){return file?`<img src="${file}" alt="">`:icon}function render(){found.clear();const p=phases[current];document.querySelector('#phaseTitle').textContent=p.title;document.querySelector('#progressText').textContent=`FASE ${current+1} DE ${phases.length}`;document.querySelector('#progressBar').style.width=`${(current+1)/phases.length*100}%`;document.querySelector('#charName').textContent=p.name;const portrait=document.querySelector('#characterImage');portrait.src=p.person;portrait.alt=p.name;document.querySelector('#next').classList.add('hidden');status.className='status';status.textContent='BOA SORTE, VIAJANTE!';scene.querySelectorAll('.object').forEach(e=>e.remove());p.items.forEach(([icon,name,file],i)=>{const b=document.createElement('button');b.className='object';const [x,y]=positions[i];b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label',name);b.innerHTML=`<span>${markup(icon,file)}</span>`;b.addEventListener('click',()=>pick(icon,name,b));scene.appendChild(b)});targets.innerHTML='';p.targets.forEach(([label,icon,file],i)=>{const d=document.createElement('div');d.className='target';d.id='target'+i;d.innerHTML=`<span>${markup(icon,file)}</span><small>${label}</small>`;targets.appendChild(d)})}function pick(icon,name,b){const p=phases[current],match=p.targets.findIndex(t=>t[1]===icon);speak(name);if(match>=0){if(found.has(match))return;found.add(match);document.querySelector('#target'+match).classList.add('done');b.classList.add('found');status.className='status ok';status.textContent=`MUITO BEM! ${name}!`;if(found.size===3){status.textContent='FASE COMPLETA! VOCÊ ACHOU TODOS!';document.querySelector('#next').classList.remove('hidden')}}else{status.className='status no';status.textContent=`${name}! ESSE NÃO ESTÁ NA FAIXA. TENTE OUTRO!`}}document.querySelector('#next').onclick=()=>{if(current<phases.length-1){current++;render()}else document.querySelector('#finish').classList.remove('hidden')};document.querySelector('#restart').onclick=()=>{document.querySelector('#finish').classList.add('hidden');current=0;render()};document.querySelector('#replay').onclick=()=>speak(phases[current].targets.map(t=>t[0]).join(', '));render();
</script></body></html>
